name: Build & Run on Android Emulator (macOS, HVF)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run-emulator:
        description: 'Also launch the Android emulator (requires HW virtualization: KVM/HVF)'
        type: boolean
        default: false

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build-and-run:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Android cmdline-tools (macOS)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o ct.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q ct.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install NDK, platform-tools, emulator, system image
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "ndk;25.2.9519653" "system-images;android-30;default;arm64-v8a"

      - name: Build with ndk-build (arm64)
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          "$NDK_DIR/ndk-build" APP_ABI=arm64-v8a APP_PLATFORM=android-21
          echo '--- built binaries ---'
          find libs -type f

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: libs/**

      - name: Run on arm64 emulator (best-effort; needs HW virtualization)
        if: ${{ inputs.run-emulator == true }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          profile: pixel
          cores: 2
          emulator-boot-timeout: 600
          script: |
            adb push libs/arm64-v8a/test /data/local/tmp/test
            adb shell chmod 755 /data/local/tmp/test
            echo '=== running test binary on emulator ==='
            adb shell /data/local/tmp/test | tee run_output.log
            echo '=== done ==='
            adb exec-out screencap -p > screenshot.png
            echo 'screenshot saved to screenshot.png'

      - name: Upload run output & screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-run
          path: |
            run_output.log
            screenshot.png
