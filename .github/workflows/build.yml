name: Build & test tbox database API

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run-emulator:
        description: 'Also attempt to run the test on an Android emulator (best-effort; hosted runners usually lack nested virtualization)'
        type: boolean
        default: false

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  SQLITE_VERSION: '3540100'
  SQLITE_YEAR: '2026'

jobs:
  # ------------------------------------------------------------------------
  # Cross-compile the tbox database test for Android (arm64).
  # ------------------------------------------------------------------------
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;25.2.9519653"

      - name: Fetch SQLite amalgamation
        run: sh scripts/fetch-sqlite3.sh

      - name: Build with ndk-build (arm64-v8a + x86_64)
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          "$NDK_DIR/ndk-build" -j"$(nproc)" APP_ABI="arm64-v8a x86_64" APP_PLATFORM=android-24
          echo '--- built binaries ---'
          find libs -type f

      - name: Upload Android test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: libs/*/test
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Build and run the same test natively on Linux.  This actually executes
  # the tbox database connection API and produces the test output.
  # ------------------------------------------------------------------------
  host-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch SQLite amalgamation
        run: sh scripts/fetch-sqlite3.sh

      - name: Build and run database connection test
        run: |
          set -o pipefail
          make -C tests/host run 2>&1 | tee "$RUNNER_TEMP/host-run.log"

      - name: Upload host run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-run-log
          path: ${{ runner.temp }}/host-run.log
          if-no-files-found: warn

  # ------------------------------------------------------------------------
  # Optional: try to boot an emulator and execute the Android binary.
  # GitHub-hosted runners generally do not expose KVM/HVF, so software
  # emulation is used and this job is best-effort.
  # ------------------------------------------------------------------------
  emulator-run:
    if: ${{ inputs.run-emulator == true }}
    needs: android-build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install emulator and x86_64 system image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "emulator" "system-images;android-28;default;x86_64"

      - name: Run test on x86_64 emulator (software acceleration)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel
          cores: 4
          ram-size: 4096
          disable-linux-hw-accel: true
          emulator-boot-timeout: 3600
          script: |
            adb push libs/x86_64/test /data/local/tmp/test
            adb shell chmod 755 /data/local/tmp/test
            echo '=== running test binary on emulator ==='
            adb shell /data/local/tmp/test | tee run_output.log
            echo '=== done ==='
            adb exec-out screencap -p > screenshot.png

      - name: Upload emulator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-run
          path: |
            run_output.log
            screenshot.png
          if-no-files-found: warn
