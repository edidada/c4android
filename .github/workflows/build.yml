name: Build & Run on Android Emulator

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install NDK, platform-tools, emulator, system image
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "ndk;25.2.9519653" "system-images;android-30;default;x86_64"

      - name: Build with ndk-build (x86_64)
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          "$NDK_DIR/ndk-build" APP_ABI=x86_64 APP_PLATFORM=android-21
          echo '--- built binaries ---'
          find libs -type f

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: libs/**

      - name: Run on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel
          cores: 2
          script: |
            adb push libs/x86_64/test /data/local/tmp/test
            adb shell chmod 755 /data/local/tmp/test
            echo '=== running test binary on emulator ==='
            adb shell /data/local/tmp/test | tee run_output.log
            echo '=== done ==='
            adb exec-out screencap -p > screenshot.png
            echo 'screenshot saved to screenshot.png'

      - name: Upload run output & screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-run
          path: |
            run_output.log
            screenshot.png
